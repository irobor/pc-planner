<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
  @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;font-family:'Onest',system-ui,sans-serif;background:radial-gradient(120% 120% at 80% 0%,#eef3f9 0%,#e6ecf4 55%,#dfe6ef 100%);color:#1f2733;-webkit-font-smoothing:antialiased">

  <div style="width:100%;max-width:880px;background:#ffffff;border:1px solid #e3e9f1;border-radius:28px;box-shadow:0 30px 60px -28px rgba(33,52,82,0.30),0 2px 0 #fff inset;overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr">

    <!-- LEFT: illustration -->
    <div style="position:relative;padding:44px 40px;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#eef3fa 0%,#e3ebf6 100%);border-right:1px solid #e6edf5">

      <!-- decorative dots -->
      <div style="position:absolute;top:34px;left:34px;width:8px;height:8px;border-radius:50%;background:{{ accent }};opacity:.35;animation:drift 5.5s ease-in-out infinite"></div>
      <div style="position:absolute;bottom:54px;right:40px;width:13px;height:13px;border-radius:50%;border:2.5px solid {{ accent }};opacity:.3;animation:drift 7s ease-in-out infinite .4s"></div>
      <div style="position:absolute;top:70px;right:56px;width:5px;height:5px;border-radius:50%;background:#7e9bc4;opacity:.55;animation:drift 6.2s ease-in-out infinite .8s"></div>

      <sc-if value="{{ showIllustration }}" hint-placeholder-val="{{ true }}">
      <div style="position:relative;width:100%;max-width:300px;aspect-ratio:1/1;animation:floaty 6.5s ease-in-out infinite">
        <!-- placeholder illustration -->
        <div style="position:absolute;inset:0;border-radius:24px;background-image:repeating-linear-gradient(45deg,#e7eef8 0 11px,#dde7f4 11px 22px);border:1.5px dashed #b6c7e0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px">
          <!-- simple friendly face -->
          <div style="width:120px;height:120px;border-radius:50%;background:#ffffff;border:2px solid #cdd9ec;box-shadow:0 8px 20px -10px rgba(50,80,130,.4);display:flex;align-items:center;justify-content:center;gap:26px">
            <div style="width:13px;height:26px;background:#5d77a0;border-radius:8px;animation:blink 5s infinite"></div>
            <div style="width:13px;height:26px;background:#5d77a0;border-radius:8px;animation:blink 5s infinite .15s"></div>
          </div>
          <div style="font-family:'Onest',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7c93b8;font-weight:600">иллюстрация 404</div>
        </div>
      </div>
      </sc-if>
    </div>

    <!-- RIGHT: content -->
    <div style="padding:56px 52px;display:flex;flex-direction:column;justify-content:center;gap:18px">

      <div style="display:flex;align-items:baseline;gap:14px">
        <span style="font-size:88px;line-height:.85;font-weight:800;letter-spacing:-.04em;color:{{ accent }}">{{ code }}</span>
        <span style="font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#9aa6ba;padding-bottom:10px">ошибка</span>
      </div>

      <h1 style="margin:0;font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.02em;color:#1f2733">{{ heading }}</h1>

      <p style="margin:0;font-size:16px;line-height:1.6;color:#647184;max-width:38ch;text-wrap:pretty">{{ message }}</p>

      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px">
        <a href="/" style="display:inline-flex;align-items:center;gap:9px;background:{{ accent }};color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:13px 24px;border-radius:13px;box-shadow:0 12px 24px -10px {{ accentShadow }};transition:transform .15s ease,box-shadow .15s ease" style-hover="transform:translateY(-2px);box-shadow:0 16px 30px -10px {{ accentShadow }}">
          <span style="font-size:17px;line-height:1">←</span> На главную
        </a>
        <a href="javascript:history.back()" style="display:inline-flex;align-items:center;gap:8px;background:#fff;color:#5a6678;text-decoration:none;font-weight:600;font-size:15px;padding:13px 22px;border-radius:13px;border:1.5px solid #dbe3ef;transition:border-color .15s ease,color .15s ease" style-hover="border-color:#bccbe2;color:#2a3340">
          Назад
        </a>
      </div>

      <div style="margin-top:8px;font-size:13px;color:#98a4b6;line-height:1.5">
        Возможно, ссылка устарела или в адресе закралась опечатка.
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1100, &quot;height&quot;: 720 },
  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#4a72b8&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#4a72b8&quot;, &quot;#3f8a9c&quot;, &quot;#5a6bbf&quot;, &quot;#5e7e9e&quot;, &quot;#26303f&quot;] },
  &quot;code&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;404&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;heading&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Кажется, вы свернули не туда&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;message&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Мы обыскали все полки, заглянули под диван, но этой страницы нигде нет. Давайте вернём вас на знакомую территорию.&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;showIllustration&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot; }
}">
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? "#4a72b8";
    return {
      accent,
      accentShadow: accent + "88",
      code: this.props.code ?? "404",
      heading: this.props.heading ?? "Кажется, вы свернули не туда",
      message: this.props.message ?? "Мы обыскали все полки, заглянули под диван, но этой страницы нигде нет. Давайте вернём вас на знакомую территорию.",
      showIllustration: this.props.showIllustration ?? true,
    };
  }
}
</script>
</body>
</html>
